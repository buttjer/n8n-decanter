name: Publish

# Publishes to npm when a GitHub Release is published. An agent may cut the
# release (release PR, tag, GitHub Release); putting it on npm stays the
# maintainer's act, and that is enforced here, not just written down:
#
# - The job runs in the `npm` environment, whose required reviewer is the
#   maintainer. GitHub holds the job until they approve it. The approval is
#   checked by GitHub, with their GitHub login; the token on the agents'
#   machine carries no Deployments, Administration or Workflows permission,
#   so it can neither approve, loosen the environment, nor edit this file.
# - There is no npm token anywhere. npm Trusted Publishing (OIDC) trusts only
#   this repo + this file + the `npm` environment, so a workflow edited to
#   drop the environment gets no publish rights.
# - "Prevent self-review" must stay off on the environment: releases are
#   created under the maintainer's own account, so with it on nobody could
#   approve.
#
# Every published version carries npm provenance pointing at the run that
# built it, and GitHub keeps who approved it — a record the agents' machine
# cannot edit.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1; Node 24's bundled npm may be older.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # A release whose tag disagrees with package.json would publish the
      # wrong version under the right name; refuse before anything goes out.
      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::release tag $TAG does not match package.json $version"
            exit 1
          fi
      - run: npm publish --provenance
